<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BaseCamp — P2P Chat</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#020617;
  color:#e5e7eb;
  height:100vh;
}
button,input{
  font:inherit;
}
button{
  cursor:pointer;
}
.hidden{display:none!important}

#login{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.loginbox{
  width:390px;
  max-width:100%;
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:20px;
  padding:30px;
  box-shadow:0 20px 60px #0008;
}
.logo{
  font-size:30px;
  font-weight:800;
  margin-bottom:6px;
}
.sub{
  color:#94a3b8;
  margin-bottom:25px;
}
input{
  width:100%;
  background:#020617;
  color:#fff;
  border:1px solid #334155;
  border-radius:10px;
  padding:12px;
  outline:none;
}
input:focus{
  border-color:#38bdf8;
}
button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  background:#0284c7;
  color:white;
  font-weight:700;
}
button:hover{
  background:#0369a1;
}
.loginbtn{
  width:100%;
  margin-top:12px;
}
.error{
  color:#f87171;
  margin-top:10px;
  font-size:14px;
}

#app{
  height:100vh;
  display:grid;
  grid-template-columns:280px 1fr;
}

.sidebar{
  border-right:1px solid #1e293b;
  background:#0b1120;
  display:flex;
  flex-direction:column;
  min-width:0;
}
.sidehead{
  padding:20px;
  border-bottom:1px solid #1e293b;
}
.brand{
  font-size:23px;
  font-weight:800;
}
.tag{
  font-size:12px;
  color:#64748b;
  margin-top:3px;
}
.me{
  margin-top:18px;
  padding:12px;
  background:#111827;
  border:1px solid #1e293b;
  border-radius:12px;
}
.me-name{
  font-weight:700;
}
.peerid{
  color:#64748b;
  font-size:11px;
  word-break:break-all;
  margin-top:5px;
}
.sidebody{
  padding:15px;
  overflow:auto;
}
.section{
  color:#64748b;
  font-size:11px;
  text-transform:uppercase;
  font-weight:800;
  margin:12px 5px 8px;
}
.friend{
  width:100%;
  text-align:left;
  background:transparent;
  padding:11px;
  margin-bottom:4px;
  border-radius:9px;
  color:#cbd5e1;
}
.friend:hover,
.friend.active{
  background:#172033;
}
.status{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#64748b;
  margin-right:7px;
}
.status.online{
  background:#22c55e;
}
.empty{
  color:#64748b;
  font-size:13px;
  padding:8px 5px;
}

.connectbox{
  margin-top:15px;
  padding:13px;
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:12px;
}
.connectbox input{
  margin-top:8px;
  font-size:12px;
}
.connectbox button{
  margin-top:8px;
  width:100%;
}

.main{
  min-width:0;
  display:flex;
  flex-direction:column;
}
.chathead{
  min-height:70px;
  border-bottom:1px solid #1e293b;
  display:flex;
  align-items:center;
  padding:15px 20px;
  justify-content:space-between;
}
.chatname{
  font-weight:800;
  font-size:18px;
}
.chatstate{
  font-size:12px;
  color:#64748b;
  margin-top:3px;
}
.messages{
  flex:1;
  overflow:auto;
  padding:25px;
}
.message{
  max-width:70%;
  margin-bottom:13px;
}
.message.mine{
  margin-left:auto;
}
.bubble{
  display:inline-block;
  padding:10px 13px;
  border-radius:13px;
  background:#1e293b;
  word-break:break-word;
}
.mine .bubble{
  background:#0369a1;
}
.meta{
  font-size:10px;
  color:#64748b;
  margin-top:4px;
}
.composer{
  padding:15px;
  border-top:1px solid #1e293b;
  display:flex;
  gap:9px;
}
.composer input{
  flex:1;
}
.composer button{
  width:90px;
}
.welcome{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
  text-align:center;
  padding:30px;
}
.welcome strong{
  color:#cbd5e1;
  font-size:24px;
  display:block;
  margin-bottom:8px;
}

@media(max-width:700px){
  #app{
    grid-template-columns:90px 1fr;
  }
  .brand{
    font-size:17px;
  }
  .tag,
  .me,
  .connectbox,
  .section{
    display:none;
  }
  .sidehead{
    padding:15px 10px;
    text-align:center;
  }
  .sidebody{
    padding:8px;
  }
  .friend{
    padding:12px 5px;
    text-align:center;
  }
  .friend .status{
    margin:0;
  }
  .friend span.name{
    display:none;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="loginbox">
    <div class="logo">⚡ BaseCamp</div>
    <div class="sub">Simple peer-to-peer chat</div>

    <input id="username" maxlength="24" placeholder="Choose your name">
    <button class="loginbtn" onclick="login()">Enter BaseCamp</button>

    <div id="loginError" class="error"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <aside class="sidebar">

    <div class="sidehead">
      <div class="brand">⚡ BaseCamp</div>
      <div class="tag">P2P CHANNELS</div>

      <div class="me">
        <div class="me-name" id="myName"></div>
        <div class="peerid" id="myPeerId">Connecting...</div>
      </div>
    </div>

    <div class="sidebody">

      <div class="section">Friends</div>

      <div id="friends"></div>

      <div class="connectbox">
        <b>Connect Friend</b>

        <input
          id="friendName"
          maxlength="24"
          placeholder="Friend's name"
        >

        <input
          id="friendPeerId"
          placeholder="Friend's Peer ID"
        >

        <button onclick="connectFriend()">Connect</button>
      </div>

    </div>
  </aside>

  <main class="main">

    <div id="welcome" class="welcome">
      <div>
        <strong>Welcome to BaseCamp</strong>
        Connect to a friend using their Peer ID.
      </div>
    </div>

    <div id="chat" class="hidden" style="height:100%;display:flex;flex-direction:column">

      <div class="chathead">
        <div>
          <div class="chatname" id="chatName"></div>
          <div class="chatstate" id="chatState"></div>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="composer">
        <input
          id="messageInput"
          placeholder="Type a message..."
          onkeydown="if(event.key==='Enter')sendMessage()"
        >
        <button onclick="sendMessage()">Send</button>
      </div>

    </div>

  </main>
</div>

<script>
const STORAGE = "basecamp_simple_p2p";

let data = {
  profile:null,
  friends:{},
  messages:{}
};

let peer = null;
let connections = {};
let currentFriend = null;


/* =========================
   STORAGE
========================= */

function loadData(){
  try{
    const saved = localStorage.getItem(STORAGE);

    if(saved){
      const parsed = JSON.parse(saved);

      data = {
        profile: parsed.profile || null,
        friends: parsed.friends || {},
        messages: parsed.messages || {}
      };
    }
  }catch(e){
    console.error(e);
  }
}

function saveData(){
  localStorage.setItem(STORAGE, JSON.stringify(data));
}


/* =========================
   LOGIN
========================= */

function login(){

  const input = document.getElementById("username");
  const error = document.getElementById("loginError");

  const name = input.value.trim();

  if(name.length < 1){
    error.textContent = "Enter a name first.";
    return;
  }

  data.profile = {
    name:name
  };

  saveData();

  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  document.getElementById("myName").textContent = name;

  startPeer();
  renderFriends();
}


/* =========================
   PEER
========================= */

function startPeer(){

  peer = new Peer();

  peer.on("open", id => {

    document.getElementById("myPeerId").textContent =
      "Peer ID: " + id;

    console.log("My Peer ID:", id);

  });

  peer.on("connection", conn => {

    setupConnection(conn);

  });

  peer.on("error", err => {

    console.error("Peer error:",err);

    document.getElementById("myPeerId").textContent =
      "Peer error: " + err.type;

  });
}


/* =========================
   CONNECT
========================= */

function connectFriend(){

  const nameInput = document.getElementById("friendName");
  const idInput = document.getElementById("friendPeerId");

  const name = nameInput.value.trim() || "Friend";
  const peerId = idInput.value.trim();

  if(!peerId){
    alert("Enter your friend's Peer ID.");
    return;
  }

  if(peerId === peer.id){
    alert("That's your own Peer ID.");
    return;
  }

  const conn = peer.connect(peerId, {
    reliable:true
  });

  conn.friendName = name;

  setupConnection(conn);

  nameInput.value = "";
  idInput.value = "";
}


/* =========================
   CONNECTION
========================= */

function setupConnection(conn){

  if(!conn) return;

  conn.on("open", () => {

    connections[conn.peer] = conn;

    conn.send({
      type:"hello",
      name:data.profile.name
    });

    renderFriends();

    console.log("Connected:",conn.peer);

  });

  conn.on("data", packet => {

    handlePacket(conn,packet);

  });

  conn.on("close", () => {

    delete connections[conn.peer];

    renderFriends();

    if(
      currentFriend &&
      currentFriend.peerId === conn.peer
    ){
      updateChatState();
    }

  });

  conn.on("error", err => {

    console.error("Connection error:",err);

  });
}


/* =========================
   PACKETS
========================= */

function handlePacket(conn,packet){

  if(!packet || !packet.type) return;


  /* HELLO */

  if(packet.type === "hello"){

    const peerId = conn.peer;

    if(!data.friends[peerId]){

      data.friends[peerId] = {
        name:packet.name || "Friend",
        peerId:peerId
      };

    }else{

      data.friends[peerId].name =
        packet.name || data.friends[peerId].name;

    }

    saveData();
    renderFriends();

    conn.send({
      type:"hello_ack",
      name:data.profile.name
    });

    return;
  }


  /* HELLO ACK */

  if(packet.type === "hello_ack"){

    const peerId = conn.peer;

    if(!data.friends[peerId]){

      data.friends[peerId] = {
        name:packet.name || conn.friendName || "Friend",
        peerId:peerId
      };

    }else{

      data.friends[peerId].name =
        packet.name ||
        data.friends[peerId].name;

    }

    saveData();
    renderFriends();

    return;
  }


  /* MESSAGE */

  if(packet.type === "message"){

    const peerId = conn.peer;

    if(!data.friends[peerId]){

      data.friends[peerId] = {
        name:packet.fromName || "Friend",
        peerId:peerId
      };

    }

    if(!data.messages[peerId]){
      data.messages[peerId] = [];
    }

    data.messages[peerId].push({
      text:packet.text,
      mine:false,
      time:packet.time || Date.now()
    });

    saveData();

    renderFriends();

    if(currentFriend && currentFriend.peerId === peerId){
      renderMessages();
    }

    return;
  }
}


/* =========================
   FRIENDS
========================= */

function renderFriends(){

  const box = document.getElementById("friends");

  box.innerHTML = "";

  const friends = Object.values(data.friends);

  if(friends.length === 0){

    box.innerHTML =
      '<div class="empty">No friends connected yet.</div>';

    return;
  }

  friends.forEach(friend => {

    const button = document.createElement("button");

    button.className =
      "friend " +
      (
        currentFriend &&
        currentFriend.peerId === friend.peerId
        ? "active"
        : ""
      );

    const online =
      !!connections[friend.peerId];

    button.innerHTML =
      `<span class="status ${online ? "online":""}"></span>` +
      `<span class="name">${escapeHTML(friend.name)}</span>`;

    button.onclick = () => openChat(friend);

    box.appendChild(button);

  });
}


/* =========================
   CHAT
========================= */

function openChat(friend){

  currentFriend = friend;

  document.getElementById("welcome").classList.add("hidden");
  document.getElementById("chat").classList.remove("hidden");

  document.getElementById("chatName").textContent =
    friend.name;

  updateChatState();
  renderMessages();
  renderFriends();

  document.getElementById("messageInput").focus();
}


function updateChatState(){

  if(!currentFriend) return;

  const online =
    !!connections[currentFriend.peerId];

  document.getElementById("chatState").textContent =
    online
      ? "● Connected directly"
      : "○ Offline — messages stay on this device";
}


function renderMessages(){

  if(!currentFriend) return;

  const box =
    document.getElementById("messages");

  box.innerHTML = "";

  const list =
    data.messages[currentFriend.peerId] || [];

  list.forEach(message => {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message " +
      (message.mine ? "mine" : "");

    const bubble =
      document.createElement("div");

    bubble.className = "bubble";
    bubble.textContent = message.text;

    const meta =
      document.createElement("div");

    meta.className = "meta";

    meta.textContent =
      new Date(message.time).toLocaleTimeString(
        [],
        {hour:"2-digit",minute:"2-digit"}
      );

    wrapper.appendChild(bubble);
    wrapper.appendChild(meta);

    box.appendChild(wrapper);

  });

  box.scrollTop = box.scrollHeight;
}


/* =========================
   SEND
========================= */

function sendMessage(){

  if(!currentFriend) return;

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  if(!text) return;

  const peerId =
    currentFriend.peerId;

  if(!data.messages[peerId]){
    data.messages[peerId] = [];
  }

  const message = {
    text:text,
    mine:true,
    time:Date.now()
  };

  data.messages[peerId].push(message);

  saveData();

  const conn =
    connections[peerId];

  if(conn && conn.open){

    conn.send({
      type:"message",
      text:text,
      fromName:data.profile.name,
      time:message.time
    });

  }

  input.value = "";

  renderMessages();
}


/* =========================
   HELPERS
========================= */

function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

loadData();

if(data.profile){

  document.getElementById("username").value =
    data.profile.name;

}
</script>

</body>
</html>
